name: Keep Supabase awake

# يمنع إيقاف مشروع Supabase المجاني بسبب الخمول (يوقفه بعد ~7 أيام بلا نشاط).
# يعمل يوميًا، ويقرأ من قاعدة البيانات فعليًا (عدّ صفوف) عبر REST، مع تحقق من خدمة الدخول.
# عند الفشل يُعاد المحاولة 3 مرات ثم تفشل المهمة فيصل إشعار GitHub بالبريد.

on:
  schedule:
    - cron: '0 6 * * *' # يوميًا 06:00 UTC
  workflow_dispatch: # تشغيل يدوي عند الحاجة

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (DB read + auth health)
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          ANON: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          ok=0
          for i in 1 2 3; do
            db=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
              "$SUPABASE_URL/rest/v1/colleges?select=id&limit=1" \
              -H "apikey: $ANON" -H "Authorization: Bearer $ANON" -H "Prefer: count=exact")
            au=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
              "$SUPABASE_URL/auth/v1/health" -H "apikey: $ANON")
            echo "try $i: db=$db auth=$au"
            if { [ "$db" = "200" ] || [ "$db" = "206" ]; } && [ "$au" = "200" ]; then ok=1; break; fi
            sleep 20
          done
          if [ "$ok" != "1" ]; then
            echo "Supabase unreachable — المشروع غالبًا متوقف (Paused)، افتح لوحة Supabase واضغط Restore."
            exit 1
          fi
